name: Deploy Astro a GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# n8n publica cada mañana dos commits con segundos de diferencia (imagen y
# post), lo que lanzaba dos despliegues a la vez. GitHub Pages solo admite uno
# activo, así que uno de los dos fallaba a diario y llegó a dejar un post sin
# publicar. Con esto el segundo espera en cola en vez de chocar.
# No se cancela el que está en curso: es un despliegue a producción y se le
# deja terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Astro
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- AQUÍ VA EL NUEVO CÓDIGO ---
      - name: Notify Telegram on Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 ¡Nuevo post publicado en Physics of Hobbies!
            "${{ github.event.head_commit.message }}"
            Míralo aquí: https://physicsofhobbies.com/
